# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 200
  seed: 1337
  user_dir: ???
  empty_cache_freq: 10000

checkpoint:
  save_interval_updates: 10000
  keep_interval_updates: 4
  no_epoch_checkpoints: true


distributed_training:
  ddp_backend: no_c10d
  distributed_backend: 'nccl'
  distributed_world_size: 32
  # distributed_port: 29671
  # nprocs_per_node: 8

task:
  _name: av_hubert_pretraining
  data: ???
  label_dir: ???
  labels: ["km"]
  label_rate: ${model.label_rate}
  sample_rate: 25
  max_sample_size: 600
  min_sample_size: 5
  pad_audio: true
  random_crop: false
  normalize: true
  stack_order_audio: 4
  input_modality: image
  image_aug: true
  # max_trim_sample_size: 400
  noise_prob: 0.5
  noise_snr: 0
  noise_wav: ???
  load_mel: false
  avg: 1

dataset:
  num_workers: 4
  max_tokens: 1000
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 5
  validate_interval_updates: 10000

criterion:
  _name: model
  log_keys: ["modality_dropout","video_cls","audio_cls","audio_video_cls","accuracy","codebook_maxfreq", "codebook_minfreq", "codebook_entropy"]
  loss_weights:
    loss_cls: 1.0
    loss_extra: 1.0

optimization:
  max_update: 400000
  lr: [0.0005]
  clip_norm: 10.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: tri_stage
  phase_ratio: [0.05,0.85,0.1]

model:
  _name: av_hubert_distill_whipser_offline_bestrq
  label_rate: 25
  skip_masked: false
  skip_nomask: false
  modality_dropout: 0.5
  audio_dropout: 0.5
  modality_fuse: concat
  selection_type: same_seq
  masking_type: feature
  mask_prob_image: 0.3
  mask_length_image: 5
  mask_prob_audio: 0.8
  mask_length_audio: 10
  extractor_mode: default
  # conv_feature_layers: '[(512,10,5)] + [(512,3,2)] * 4 + [(512,2,2)] * 2'
  final_dim: 256
  encoder_layerdrop: 0.05
  dropout_input: 0.1
  dropout_features: 0.1
  dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 0.1
  untie_final_proj: true
  activation_dropout: 0.0
  wav_input: false
  layer_norm_first: true
  audio_feat_dim: 104
  modality_scheduler: false
  cb_dim: 32
  cb_vocab: 8192

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
