# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 200
  tensorboard_logdir: tblog
  seed: 1337
  user_dir: ???

checkpoint:
  # save_interval: 2
  # keep_interval_updates: 1
  no_epoch_checkpoints: true
  save_interval_updates: 10000
  keep_interval_updates: 12
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: no_c10d
  find_unused_parameters: true
  distributed_world_size: 8
  # distributed_port: 29671
  # nprocs_per_node: 8

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???
  label_dir: ???
  tokenizer_bpe_model: ???
  normalize: true  # must be consistent with pre-training
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 500
  modalities: ["video","audio"]
  image_aug: true
  pad_audio: true
  random_crop: false
  noise_prob: 0.
  noise_snr: 0
  noise_wav: /train8/asrprg/anonymous/musan/musan/tsv/all_mixspeech_v2

dataset:
  num_workers: 6
  max_tokens: 500
  validate_after_updates: 0
  validate_interval: 2
  train_subset: train
  valid_subset: valid

criterion:
  _name: model
  log_keys:
    - "accuracy"
  loss_weights:
    loss_ce: 1.0
    loss_mse: 0.0
    loss_cos: 0.0
    loss_ctc: 0.25
    loss_visual_ctc: 0.25
    

optimization:
  max_update: 60000
  lr: [0.0002]
  update_freq: [2]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 20000
  hold_steps: 0
  decay_steps: 40000
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq_llm_s12_pretrain
  w2v_path: ???
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  feature_grad_mult: 1.0
  freeze_finetune_updates: 0
  mask_label_prob: 0.25


hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
          - criterion.wer_kenlm_model
          - criterion.wer_lexicon
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
